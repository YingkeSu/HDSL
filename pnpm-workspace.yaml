packages:
  - apps/*
  - packages/*

# pnpm 11 does not read these two keys from `.npmrc`; they only take effect
# here (verified by tests/engineering/pnpm-config.test.ts). The repository
# previously declared them in `.npmrc`, where pnpm silently ignored them:
#   - saveExact:    `pnpm add` writes an exact version instead of a ^/~ range.
#   - engineStrict: an unsupported Node version fails install instead of only
#                   printing a warning.
saveExact: true
engineStrict: true

# esbuild's postinstall only verifies/downloads a binary already provided by
# its optional platform package (@esbuild/<platform>), so the install script is
# explicitly not run. Declaring it keeps `pnpm install --frozen-lockfile`
# deterministic and non-interactive in CI.
# electron-winstaller (transitive via electron-builder) only prepares Squirrel
# Windows installer assets at install time. HDSL ships an unsigned portable
# directory/ZIP (`win.target: dir`), never a Squirrel installer, so its install
# script stays off for the same reason as esbuild's.
allowBuilds:
  electron-winstaller: false
  esbuild: false
