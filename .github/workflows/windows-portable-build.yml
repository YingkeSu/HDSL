name: Windows portable build

# Build evidence for the unsigned Windows x64 deliverables: the portable ZIP and
# the NSIS `.exe` installer. (Issue #8 is the maintainer's real-hardware
# verification and is NOT closed by this workflow.) Deliberate scope limits:
#
#   - The workspace unit suite is absent on purpose: this job must not run
#     Windows tests. The Linux `Engineering checks` job owns that suite.
#   - The portable job never starts the packaged app. `HDSL.exe` is only
#     inspected as a file tree by `apps/desktop/scripts/verify-win-package.mjs`,
#     so "the archive is complete" is the only claim that job can make.
#   - The installer job runs the installer and uninstaller silently (`/S`) on
#     the ephemeral runner and checks the installed tree. That is install/
#     uninstall layout evidence only; the installed GUI app is never launched,
#     so it is not Windows host or GUI acceptance.
#   - `permissions` is read-only: no signing identity, no release, no upload
#     credential. Release creation happens later from a reviewed SHA.
#
# Both Windows deliverables are unsigned and un-notarized; see
# docs/development/windows-portable-build.md before distributing them.

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/windows-portable-build.yml'

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-zip:
    name: unsigned portable ZIP / archive integrity (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build workspace and renderer
        run: pnpm run build:desktop

      - name: Package win-x64 unpacked directory (unsigned)
        run: pnpm --filter @hdsl/desktop run package:win

      - name: Verify packaged tree (file check only, app is not executed)
        run: node apps/desktop/scripts/verify-win-package.mjs apps/desktop/release/win-unpacked

      - name: Audit packaged tree for test, fixture and credential content
        run: node apps/desktop/scripts/verify-win-package.mjs --audit apps/desktop/release/win-unpacked

      - name: Record packaged contents
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release/win-unpacked | Select-Object Name, Length | Format-Table -AutoSize
          Get-ChildItem apps/desktop/release/win-unpacked/resources/app | Select-Object Name, Length | Format-Table -AutoSize

      - name: Zip portable directory and hash it
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $name = "HDSL-$version-win-x64-$sha-portable.zip"
          $stage = "apps/desktop/release/stage/HDSL-$version-win-x64"
          $release = "apps/desktop/release"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "$release/win-unpacked/*" -Destination $stage -Recurse -Force
          Compress-Archive -Path $stage -DestinationPath "$release/$name" -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -Path "$release/$name").Hash.ToLower()
          # Write LF, not the Windows default CRLF: the Ubuntu publish job and
          # users run `sha256sum -c`, which does not strip a carriage return.
          [System.IO.File]::WriteAllText("$release/SHA256SUMS.txt", "$hash  $name`n", [System.Text.UTF8Encoding]::new($false))
          $info = @(
            "artifact: $name",
            "version: $version",
            "base-commit: $env:GITHUB_SHA",
            "base-ref: $env:GITHUB_REF",
            "release-channel: windows-preview (unsigned, not a full MVP release)",
            "runner: $env:RUNNER_OS",
            "node: $(node --version)",
            "pnpm: $(pnpm --version)",
            "electron: $(node -p "require('./apps/desktop/package.json').devDependencies.electron")",
            "package: pnpm --filter @hdsl/desktop run package:win (electron-builder --win --x64 --dir)",
            "signing: unsigned, not notarized",
            "windows-host-evidence: none (the packaged app was not executed)"
          )
          [System.IO.File]::WriteAllText("$release/build-info.txt", ($info -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          node apps/desktop/scripts/verify-checksum-file.mjs "$release/SHA256SUMS.txt" "$name"
          if ($LASTEXITCODE -ne 0) { throw 'SHA256SUMS.txt is not sha256sum-consumable' }
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP/crlf-control.txt", "$hash  $name`r`n", [System.Text.UTF8Encoding]::new($false))
          node apps/desktop/scripts/verify-checksum-file.mjs "$env:RUNNER_TEMP/crlf-control.txt" "$name"
          if ($LASTEXITCODE -ne 1) { throw "CRLF negative control was not rejected (exit $LASTEXITCODE)" }
          # GitHub's pwsh wrapper exits with $LASTEXITCODE, so clear the
          # intentional failure from the negative control before continuing.
          $LASTEXITCODE = 0
          Write-Host 'PASS: SHA256SUMS.txt is LF-only and BOM-free; the CRLF control was rejected.'
          Get-Content "$release/SHA256SUMS.txt"
          Get-Content "$release/build-info.txt"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hdsl-win-x64-portable-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.zip
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/release/build-info.txt

  nsis-installer:
    name: unsigned NSIS installer / silent install-uninstall (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build workspace and renderer
        run: pnpm run build:desktop

      - name: Package unsigned NSIS installer (.exe)
        run: pnpm --filter @hdsl/desktop run package:win:nsis

      - name: Verify the .exe is an NSIS PE installer; name it with version and short SHA
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          # The expected name comes from nsis.artifactName; pin it so an unrelated
          # .exe in release/ can never be picked up as the deliverable.
          $expected = "HDSL-$version-win-x64-setup.exe"
          $installer = Get-Item -Path "apps/desktop/release/$expected" -ErrorAction SilentlyContinue
          if (-not $installer) { throw "electron-builder produced no $expected installer" }
          Write-Host "installer: $($installer.FullName) ($($installer.Length) bytes)"
          node apps/desktop/scripts/verify-win-package.mjs --installer $installer.FullName
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $name = "HDSL-$version-win-x64-$sha-setup.exe"
          Rename-Item -Path $installer.FullName -NewName $name
          "HDSL_INSTALLER_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Silent install into an isolated directory
        shell: pwsh
        run: |
          $installer = Join-Path 'apps/desktop/release' $env:HDSL_INSTALLER_NAME
          $target = Join-Path $env:RUNNER_TEMP 'hdsl-install'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $proc = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "installer exited with code $($proc.ExitCode)" }
          if (-not (Test-Path (Join-Path $target 'HDSL.exe'))) { throw 'HDSL.exe missing after silent install' }
          node apps/desktop/scripts/verify-win-package.mjs $target
          node apps/desktop/scripts/verify-win-package.mjs --audit $target
          "HDSL_INSTALL_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Seed user-data sentinels, then upgrade in place
        shell: pwsh
        run: |
          $sentinels = @(
            (Join-Path $env:APPDATA 'HDSL\hdsl-installer-sentinel.txt'),
            (Join-Path $env:APPDATA '@hdsl\desktop\hdsl-installer-sentinel.txt'),
            (Join-Path $env:LOCALAPPDATA 'HDSL\hdsl-installer-sentinel.txt')
          )
          foreach ($sentinel in $sentinels) {
            New-Item -ItemType Directory -Force -Path (Split-Path $sentinel) | Out-Null
            Set-Content -Path $sentinel -Value 'must survive install, upgrade and uninstall' -Encoding ascii
          }
          $installer = Join-Path 'apps/desktop/release' $env:HDSL_INSTALLER_NAME
          $proc = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$($env:HDSL_INSTALL_DIR)" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "upgrade installer exited with code $($proc.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:HDSL_INSTALL_DIR 'HDSL.exe'))) { throw 'HDSL.exe missing after in-place upgrade' }
          foreach ($sentinel in $sentinels) {
            if (-not (Test-Path $sentinel)) { throw "in-place upgrade removed user data: $sentinel" }
          }
          "HDSL_SENTINELS=$($sentinels -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Silent uninstall and prove user data survives
        shell: pwsh
        run: |
          $target = $env:HDSL_INSTALL_DIR
          $uninstaller = Get-ChildItem $target -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'uninstaller not found in the installed directory' }
          $proc = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "uninstaller exited with code $($proc.ExitCode)" }
          for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $target 'HDSL.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $target 'HDSL.exe')) { throw 'HDSL.exe still present after silent uninstall' }
          foreach ($sentinel in ($env:HDSL_SENTINELS -split ';')) {
            if (-not (Test-Path $sentinel)) { throw "silent uninstall removed user data: $sentinel" }
          }
          Write-Host 'PASS: silent install, in-place upgrade and silent uninstall removed the app and kept user data.'

      - name: Clean up the isolated install directory and sentinels
        if: always()
        shell: pwsh
        run: |
          if ($env:HDSL_INSTALL_DIR -and (Test-Path $env:HDSL_INSTALL_DIR)) {
            Remove-Item -Recurse -Force $env:HDSL_INSTALL_DIR
          }
          foreach ($sentinel in @(
            (Join-Path $env:APPDATA 'HDSL\hdsl-installer-sentinel.txt'),
            (Join-Path $env:APPDATA '@hdsl\desktop\hdsl-installer-sentinel.txt'),
            (Join-Path $env:LOCALAPPDATA 'HDSL\hdsl-installer-sentinel.txt')
          )) {
            if (Test-Path $sentinel) { Remove-Item -Force $sentinel }
          }

      - name: Hash the installer and record provenance
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          $name = $env:HDSL_INSTALLER_NAME
          $release = 'apps/desktop/release'
          $hash = (Get-FileHash -Algorithm SHA256 -Path "$release/$name").Hash.ToLower()
          # Write LF, not the Windows default CRLF: the Ubuntu publish job and
          # users run `sha256sum -c`, which does not strip a carriage return.
          [System.IO.File]::WriteAllText("$release/SHA256SUMS-installer.txt", "$hash  $name`n", [System.Text.UTF8Encoding]::new($false))
          $info = @(
            "artifact: $name",
            "format: NSIS installer (.exe), Windows PE, Nullsoft Install System stub",
            "version: $version",
            "base-commit: $env:GITHUB_SHA",
            "base-ref: $env:GITHUB_REF",
            "release-channel: windows-preview (unsigned, not a full MVP release)",
            "runner: $env:RUNNER_OS",
            "node: $(node --version)",
            "pnpm: $(pnpm --version)",
            "electron: $(node -p "require('./apps/desktop/package.json').devDependencies.electron")",
            "package: pnpm --filter @hdsl/desktop run package:win:nsis (electron-builder --win nsis --x64)",
            "installer-options: oneClick=false, perMachine=false, allowToChangeInstallationDirectory=true, deleteAppDataOnUninstall=false",
            "signing: unsigned, not notarized",
            "evidence: silent /S install into an isolated directory, in-place upgrade and silent /S uninstall on the build runner; the installed tree passed the archive-integrity check and user-data sentinels survived",
            "windows-gui-evidence: none (the installed application was not launched or exercised through the UI)"
          )
          [System.IO.File]::WriteAllText("$release/build-info-installer.txt", ($info -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          node apps/desktop/scripts/verify-checksum-file.mjs "$release/SHA256SUMS-installer.txt" "$name"
          if ($LASTEXITCODE -ne 0) { throw 'SHA256SUMS-installer.txt is not sha256sum-consumable' }
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP/crlf-control-installer.txt", "$hash  $name`r`n", [System.Text.UTF8Encoding]::new($false))
          node apps/desktop/scripts/verify-checksum-file.mjs "$env:RUNNER_TEMP/crlf-control-installer.txt" "$name"
          if ($LASTEXITCODE -ne 1) { throw "installer CRLF negative control was not rejected (exit $LASTEXITCODE)" }
          # GitHub's pwsh wrapper exits with $LASTEXITCODE, so clear the
          # intentional failure from the negative control before continuing.
          $LASTEXITCODE = 0
          Write-Host 'PASS: SHA256SUMS-installer.txt is LF-only and BOM-free; the CRLF control was rejected.'
          Get-Content "$release/SHA256SUMS-installer.txt"
          Get-Content "$release/build-info-installer.txt"

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hdsl-win-x64-installer-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/SHA256SUMS-installer.txt
            apps/desktop/release/build-info-installer.txt

  verify-linux-checksums:
    name: GNU sha256sum -c on the produced checksums (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [portable-zip, nsis-installer]
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: hdsl-*
          path: release-assets
          merge-multiple: true

      - name: Consume the checksum files with GNU coreutils
        run: |
          cd release-assets
          ls -l
          # This is the same command the release publish job and users run. It
          # fails on a BOM or on CRLF, so it is the real consumer test for the
          # Windows-produced checksum files.
          sha256sum -c SHA256SUMS.txt
          sha256sum -c SHA256SUMS-installer.txt
          grep -q $'\r' SHA256SUMS.txt && { echo 'SHA256SUMS.txt contains CR'; exit 1; } || true
          grep -q $'\r' SHA256SUMS-installer.txt && { echo 'SHA256SUMS-installer.txt contains CR'; exit 1; } || true
          echo 'PASS: GNU sha256sum verified both Windows checksum files.'
